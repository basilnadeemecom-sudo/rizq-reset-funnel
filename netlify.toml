[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Force browsers to revalidate the SPA HTML on every request so a stale
# cached copy can't keep serving an out-of-date router. (Netlify still
# caches at the edge; this just stops browsers/proxies from holding it.)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# The Meta Conversions API access token is read by netlify/functions/capi.js
# from process.env.META_CAPI_TOKEN. Set it via:
#   Netlify dashboard → Site configuration → Environment variables
# (or via the Netlify API). Never commit the token to the repo.
